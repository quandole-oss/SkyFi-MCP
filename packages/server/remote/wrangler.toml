name = "skyfi-mcp"
main = "src/index.ts"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat"]

# Non-secret config
[vars]
SKYFI_API_BASE_URL = "https://app.skyfi.com/platform-api"
ENVIRONMENT = "production"
NOTIFICATION_EMAIL = "quan.le@challenger.gauntletai.com"

# Durable Object binding for McpAgent
[[durable_objects.bindings]]
name = "SKYFI_MCP"
class_name = "SkyFiMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SkyFiMCP"]
