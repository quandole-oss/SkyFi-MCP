[project]
name = "skyfi-mcp-workspace"
version = "1.0.0"
description = "MCP server for SkyFi satellite imagery platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
